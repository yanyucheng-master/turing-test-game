name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=critical
      - run: npm run check
      - run: npm test
      - run: npm run build
      # lint currently fails on vendored shadcn UI; keep local until cleaned up.
